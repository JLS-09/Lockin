[package]
name = "lockin-app"
description = "Lockin desktop app (Tauri)"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name different from the binary name,
# which avoids a name clash on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "lockin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
lockin-core.workspace = true
# Opens Ufora links in the browser ("Open in Ufora"); allowed URLs are in capabilities/default.json.
tauri-plugin-opener = "2"

# Linux only: to set the GTK program name, see `run()` in src/lib.rs.
# Same version Tauri itself uses, so nothing extra gets compiled.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
